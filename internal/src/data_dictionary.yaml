        Other: Any KBO type not covered by other values
  Oort_Cloud:
    version_id: '1.0'
    local_identifier: Oort_Cloud
    nillable_flag: false
    submitter_name: Mike Drum
    definition: Oort Cloud Object
    value_domain:
      enumeration_flag: true
      value_data_type: ASCII_Short_String_Collapsed
      unit_of_measure_type: Units_of_None
