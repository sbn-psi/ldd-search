        Inner: Objects in the inner Oort cloud
        Outer: Objects in the outer Oort cloud
        Other: Any Oort cloud type not covered by other values
  Comet:
    version_id: '1.0'
    local_identifier: Comet
    nillable_flag: false
    submitter_name: Mike Drum
    definition: Comet
    value_domain:
      enumeration_flag: true
      value_data_type: ASCII_Short_String_Collapsed
      unit_of_measure_type: Units_of_None
      permissible_values:
        Jupiter_Family: Comets that orbit Jupiter
